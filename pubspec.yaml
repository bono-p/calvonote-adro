name: calvonote
description: CalvoNote — Transcription vocale FR / EN / Fulfulde Adamawa
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Audio — enregistrement micro
  record: ^5.1.2

  # Audio — lecture fichiers WAV/MP3
  audioplayers: ^6.0.0

  # TTS natif Android (FR/EN)
  flutter_tts: ^4.0.2

  # HTTP
  http: ^1.2.1

  # Stockage clés API (sécurisé)
  flutter_secure_storage: ^9.2.2

  # Permissions micro
  permission_handler: ^11.3.1

  # Chemin fichiers temporaires
  path_provider: ^2.1.3

  # Icônes
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
