name: calvonote
description: CalvoNote — Transcription vocale FR/EN et traduction Fulfulde via Groq + HuggingFace Space
version: 1.1.0+2
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Audio — enregistrement micro
  record: ^5.1.2

  # HTTP
  http: ^1.2.2

  # Permissions micro
  permission_handler: ^11.3.1

  # Chemin fichiers temporaires
  path_provider: ^2.1.4

  # Stockage clé-valeur (préférences + historique)
  shared_preferences: ^2.3.2

  # Partage de texte vers autres apps
  share_plus: ^10.0.0

  # Icônes
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
