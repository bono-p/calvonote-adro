# ─────────────────────────────────────────────────────────────
#  codemagic.yaml — CalvoNote Android
#  Build Flutter Android (APK debug + AAB release)
# ─────────────────────────────────────────────────────────────

workflows:

  # ── Build debug APK (test rapide) ─────────────────────────
  android-debug:
    name: CalvoNote Android Debug
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
      groups:
        - api_keys    # groupe de variables dans Codemagic dashboard

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Analyse statique (non bloquante)
        script: flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: Build APK debug
        script: |
          flutter build apk --debug

    artifacts:
      - build/**/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - bono@example.com   # ← remplace par ton email
        notify:
          success: true
          failure: true

  # ── Build release AAB (publication Google Play) ───────────
  android-release:
    name: CalvoNote Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      android_signing:
        - calvonote_keystore
      groups:
        - api_keys

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Build AAB release
        script: |
          flutter build appbundle --release

    artifacts:
      - build/**/outputs/bundle/release/*.aab
      - build/**/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - bono@example.com   # ← remplace par ton email
        notify:
          success: true
          failure: true
